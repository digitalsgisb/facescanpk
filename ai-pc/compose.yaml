services:
  attendance:
    build: .
    restart: unless-stopped
    init: true
    user: "${ATTENDANCE_UID:-1000}:${ATTENDANCE_GID:-1000}"
    ports:
      - "${ATTENDANCE_BIND:-0.0.0.0}:${ATTENDANCE_PORT:-3800}:8765"
    volumes:
      - ./runtime:/app/runtime
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 20s
